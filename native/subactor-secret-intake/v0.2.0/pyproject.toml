[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-connector-subactor-secret-intake"
version = "0.2.0"
description = "Exact Subactor secret-intake and scoped credential-reuse URI Processes"
requires-python = ">=3.10"
dependencies = ["urirun>=0.4.14"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."urirun.bindings"]
subactor-secret-intake = "urirun_connector_subactor_secret_intake.core:bindings"

[tool.setuptools.packages.find]
where = ["."]
include = ["urirun_connector_subactor_secret_intake*"]

[tool.setuptools.package-data]
urirun_connector_subactor_secret_intake = ["connector.manifest.json"]
